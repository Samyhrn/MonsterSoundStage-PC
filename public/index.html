<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundStage — Contrôleur PC</title>
<style>
  :root{
    --bg0:#0a0a0f; --bg1:#12111a; --bg2:#1a1725;
    --card:rgba(255,255,255,.045); --card-brd:rgba(255,255,255,.09);
    --txt:#f4f2fb; --muted:#8f8ba6; --faint:#5d5973;
    --a1:#ff7a3c; --a2:#ff3d7f; --a3:#8b5cf6;
    --grad:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));
    --ok:#43d17a; --sh:0 24px 60px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--txt);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Inter,sans-serif;
    background:
      radial-gradient(1100px 700px at 8% -10%, rgba(255,61,127,.16), transparent 60%),
      radial-gradient(900px 650px at 100% 0%, rgba(139,92,246,.18), transparent 55%),
      radial-gradient(1000px 800px at 50% 120%, rgba(255,122,60,.12), transparent 60%),
      linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
    min-height:100%;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 60px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 30px rgba(255,61,127,.35)}
  .logo svg{width:26px;height:26px}
  .brand h1{margin:0;font-size:19px;letter-spacing:.2px;font-weight:750}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .pill{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);
        background:var(--card);border:1px solid var(--card-brd);padding:9px 15px;border-radius:999px;backdrop-filter:blur(8px)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 4px rgba(255,255,255,.04)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(67,209,122,.16)}

  .grid{display:grid;grid-template-columns:1fr 1.15fr;gap:22px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--card-brd);border-radius:24px;padding:22px;backdrop-filter:blur(14px);box-shadow:var(--sh)}
  .card h2{margin:0 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

  .dev{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;cursor:pointer;border:1px solid transparent;transition:.18s}
  .dev:hover{background:rgba(255,255,255,.04);border-color:var(--card-brd)}
  .dev.sel{background:linear-gradient(120deg,rgba(255,122,60,.14),rgba(139,92,246,.14));border-color:rgba(255,61,127,.35)}
  .dev .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.05);display:grid;place-items:center;flex:none;color:var(--a2)}
  .dev .nm{font-weight:650;font-size:15px}
  .dev .ip{color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted);font-size:14px;padding:10px 4px;line-height:1.5}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font:inherit;cursor:pointer;border:1px solid var(--card-brd);background:rgba(255,255,255,.045);color:var(--txt);
       border-radius:14px;padding:11px 16px;transition:.18s;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:rgba(255,255,255,.09);transform:translateY(-1px)}
  .btn.primary{background:var(--grad);border:none;font-weight:650;box-shadow:0 12px 26px rgba(255,61,127,.28)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  input{font:inherit;background:rgba(255,255,255,.05);border:1px solid var(--card-brd);color:var(--txt);border-radius:14px;padding:11px 14px;outline:none}
  input:focus{border-color:rgba(255,61,127,.5)}

  .btn svg{width:18px;height:18px;flex:none}

  .hero{display:flex;flex-direction:column;align-items:center;gap:20px}
  .knob{position:relative;width:236px;height:236px;touch-action:none;cursor:grab;user-select:none}
  .knob:active{cursor:grabbing}
  .knob svg{transform:rotate(-90deg)}
  .knob .val{position:absolute;inset:0;display:grid;place-items:center}
  .knob .val b{font-size:52px;font-weight:800;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .knob .val span{color:var(--muted);font-size:12px;letter-spacing:.2em;margin-top:6px}
  .knob .glow{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,rgba(255,61,127,.22),transparent 66%);filter:blur(8px);z-index:-1}

  .transport{display:flex;gap:14px;align-items:center}
  .tbtn{width:58px;height:58px;border-radius:50%;border:1px solid var(--card-brd);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer;transition:.18s;color:var(--txt)}
  .tbtn:hover{background:rgba(255,255,255,.1)}
  .tbtn svg{width:22px;height:22px}
  .tbtn.main{width:70px;height:70px;background:var(--grad);border:none;box-shadow:0 14px 30px rgba(255,61,127,.32)}
  .tbtn.main svg{width:28px;height:28px}

  .np{text-align:center;min-height:44px}
  .np .t{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:8px}
  .np .t svg{width:16px;height:16px;flex:none;color:var(--a2)}
  .np .s{color:var(--muted);font-size:12.5px;margin-top:3px}
  .eqbar{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:22px;margin-top:8px}
  .eqbar i{width:4px;background:var(--grad);border-radius:3px;animation:eq 1s infinite ease-in-out}
  @keyframes eq{0%,100%{height:20%}50%{height:100%}}

  details.adv{margin-top:22px;border:1px dashed var(--card-brd);border-radius:18px;padding:0 16px}
  details.adv summary{cursor:pointer;padding:14px 0;color:var(--muted);font-size:13.5px;letter-spacing:.05em;list-style:none;display:flex;align-items:center;gap:9px}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary svg{width:16px;height:16px}
  details.adv[open]{padding-bottom:14px}
  .diag{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.35);border:1px solid var(--card-brd);
        border-radius:14px;padding:14px;margin-top:12px;font-size:11.5px;line-height:1.55;max-height:46vh;overflow:auto;color:#cfcadd}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:rgba(20,18,26,.95);
         border:1px solid var(--card-brd);border-radius:14px;padding:12px 18px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--sh);z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{color:var(--faint);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l4-4v14l-4-4H4z" fill="#fff" stroke="none"/><path d="M15 8.5a5 5 0 0 1 0 7"/><path d="M17.5 6a8.5 8.5 0 0 1 0 12" opacity=".65"/></svg></div>
    <div class="brand"><h1>SoundStage</h1><p>Contrôleur PC — Monster SoundStage S3</p></div>
    <div class="pill"><span class="dot" id="dot"></span><span id="status">Recherche…</span></div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Enceintes</h2>
      <div id="list"><div class="empty">Aucune enceinte. Lance une recherche ci-dessous.</div></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnScan" data-i="search">Rechercher</button>
        <input id="manualIp" placeholder="IP manuelle (192.168.1.22)" style="flex:1;min-width:150px" />
        <button class="btn" id="btnAdd" data-i="plus" title="Ajouter"></button>
      </div>
      <div class="hint">L'enceinte n'annonce pas en UPnP → scan unicast / IP manuelle recommandé.</div>
    </section>

    <section class="card">
      <h2>Contrôle</h2>
      <div class="hero">
        <div class="knob" id="knob">
          <div class="glow"></div>
          <svg width="236" height="236" viewBox="0 0 236 236">
            <circle cx="118" cy="118" r="100" stroke="rgba(255,255,255,.08)" stroke-width="12" fill="none"/>
            <circle id="arc" cx="118" cy="118" r="100" stroke="url(#g)" stroke-width="12" fill="none"
                    stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff7a3c"/><stop offset="55%" stop-color="#ff3d7f"/><stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient></defs>
          </svg>
          <div class="val"><b id="volLabel">--</b><span id="volSub">VOLUME</span></div>
        </div>

        <div class="transport">
          <button class="tbtn" id="bMute" data-i="mute" title="Mute"></button>
          <button class="tbtn" id="bPrev" data-i="prev" title="Précédent"></button>
          <button class="tbtn main" id="bPlay" data-i="play" title="Lecture"></button>
          <button class="tbtn" id="bPause" data-i="pause" title="Pause"></button>
          <button class="tbtn" id="bStop" data-i="stop" title="Stop"></button>
          <button class="tbtn" id="bState" data-i="info" title="État"></button>
        </div>

        <div class="np" id="np"></div>

        <div class="row" style="width:100%">
          <input id="castUrl" placeholder="Caster un flux / mp3 (https://…)" style="flex:1;min-width:180px" />
          <button class="btn primary" id="bCast" data-i="cast">Caster</button>
        </div>
      </div>
    </section>
  </div>

  <details class="adv">
    <summary data-i="gear">Avancé — découverte &amp; diagnostics</summary>
    <div class="row">
      <button class="btn" id="bDiag" data-i="wave">Diagnostic réseau</button>
      <button class="btn" id="bUnicast" data-i="scan">Scan réseau</button>
      <button class="btn" id="bDescribe" data-i="file">Describe UPnP</button>
      <button class="btn" id="bAllplay" data-i="sliders">Chasse AllPlay</button>
      <input id="fetchPort" value="2870" style="width:80px" title="port" />
    </div>
    <pre class="diag" id="diag" style="display:none"></pre>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const state = { devices: [], sel: null, vol: 0, playing: false, polling: null };
const PORT = 2870;

/* ---- inline SVG icon set (no emoji fonts needed) ---- */
const S = (inner, fill) => `<svg viewBox="0 0 24 24" ${fill?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}>${inner}</svg>`;
const I = {
  search: S('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/>'),
  plus:   S('<path d="M12 5v14M5 12h14"/>'),
  speaker:S('<path d="M4 9h3l4-4v14l-4-4H4z" fill="currentColor" stroke="none"/><path d="M15 8.5a5 5 0 0 1 0 7"/><path d="M17.5 6a8.5 8.5 0 0 1 0 12" opacity=".6"/>'),
  play:   S('<path d="M8 5l12 7-12 7z"/>', true),
  pause:  S('<rect x="6" y="5" width="4.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="4.4" height="14" rx="1.2"/>', true),
  stop:   S('<rect x="6" y="6" width="12" height="12" rx="2"/>', true),
  prev:   S('<rect x="6" y="6" width="2.4" height="12" rx="1"/><path d="M19 6l-9 6 9 6z"/>', true),
  mute:   S('<path d="M4 9h3l4-4v14l-4-4H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>'),
  info:   S('<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.7" r="1.1" fill="currentColor" stroke="none"/>'),
  cast:   S('<path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H12"/><path d="M4 12.5a5.5 5.5 0 0 1 5.5 5.5"/><path d="M4 16.5a1.5 1.5 0 0 1 1.5 1.5"/><circle cx="4.6" cy="19.4" r="1" fill="currentColor" stroke="none"/>'),
  gear:   S('<circle cx="12" cy="12" r="3.4"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  wave:   S('<path d="M3 12h3.5l2-6 3.5 12 2.5-8 1.5 4H21"/>'),
  scan:   S('<circle cx="12" cy="12" r="2.2"/><path d="M12 2a10 10 0 0 1 10 10M12 6a6 6 0 0 1 6 6M2 12A10 10 0 0 1 12 2M6 12a6 6 0 0 1 6-6"/>'),
  file:   S('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>'),
  sliders:S('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),
  music:  S('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'),
};
// fill static buttons/summary that declare data-i
document.querySelectorAll('[data-i]').forEach(el=>{
  const ico = I[el.dataset.i]; if(!ico) return;
  el.insertAdjacentHTML('afterbegin', ico);
});

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function setStatus(t){ $('#status').textContent=t; }
function connected(on){ $('#dot').classList.toggle('on', !!on); }
async function api(path, opts){ const r=await fetch(path,opts); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||r.statusText); return j; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- devices ----------
function render(){
  const l=$('#list');
  if(!state.devices.length){ l.innerHTML='<div class="empty">Aucune enceinte. Lance une recherche ci-dessous.</div>'; return; }
  l.innerHTML = state.devices.map(d=>`
    <div class="dev ${state.sel&&state.sel.ip===d.ip?'sel':''}" data-ip="${d.ip}">
      <div class="ic">${I.speaker}</div>
      <div style="flex:1"><div class="nm">${esc(d.name||d.ip)}</div><div class="ip">${d.ip}${d.services&&d.services.length?' · '+d.services.length+' services':''}</div></div>
      <div style="color:var(--muted)">›</div>
    </div>`).join('');
  l.querySelectorAll('.dev').forEach(el=>el.onclick=()=>select(el.dataset.ip));
}
async function select(ip){
  state.sel = state.devices.find(d=>d.ip===ip) || {ip,name:ip};
  localStorage.setItem('ss_ip', ip);
  render(); setStatus(state.sel.name||ip); connected(true);
  await refreshState(); startPolling();
}
async function disc(){
  $('#btnScan').disabled=true; setStatus('Recherche…');
  const found=[];
  try{ const a=await api('/api/discover'); a.devices.forEach(d=>found.push(d)); }catch(e){}
  try{ const b=await api('/api/scan'); b.devices.forEach(d=>{ if(!found.some(x=>x.ip===d.ip)) found.push(d); }); }catch(e){}
  merge(found); render();
  setStatus(found.length?found.length+' enceinte(s)':'Rien trouvé');
  $('#btnScan').disabled=false;
  toast(found.length?`${found.length} enceinte(s) trouvée(s)`:'Aucune enceinte (essaie l’IP manuelle)');
}
function merge(found){ const m=new Map(state.devices.map(d=>[d.ip,d])); found.forEach(d=>m.set(d.ip,d)); state.devices=[...m.values()]; }
async function addManual(){
  const ip=$('#manualIp').value.trim(); if(!ip) return toast('Entre une IP');
  try{ const {device}=await api('/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip})}); merge([device]); render(); select(ip); }
  catch(e){ toast('Échec ajout : '+e.message); }
}

// ---------- DLNA ----------
function dlna(service, action, args){
  if(!state.sel) return Promise.reject(new Error('Sélectionne une enceinte'));
  return api('/api/dlna',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ip:state.sel.ip,port:PORT,service,action,args})});
}
function setRing(v){ const c=2*Math.PI*100; $('#arc').setAttribute('stroke-dashoffset', String(c*(1-v/100))); $('#volLabel').textContent=Math.round(v); }
async function getVol(){ try{ const d=await dlna('RenderingControl','GetVolume','<InstanceID>0</InstanceID><Channel>Master</Channel>'); if(d.volume!==undefined){ state.vol=d.volume; setRing(d.volume);} connected(true);}catch(e){ connected(false); } }
async function setVol(v){ state.vol=v; setRing(v); try{ await dlna('RenderingControl','SetVolume',`<InstanceID>0</InstanceID><Channel>Master</Channel><DesiredVolume>${Math.round(v)}</DesiredVolume>`);}catch(e){} }
async function mute(on){ try{ await dlna('RenderingControl','SetMute',`<InstanceID>0</InstanceID><Channel>Master</Channel><DesiredMute>${on?1:0}</DesiredMute>`); toast(on?'Mute':'Unmute'); }catch(e){toast('Erreur mute');} }
async function transport(a){ try{ const map={Play:'<InstanceID>0</InstanceID><Speed>1</Speed>',Pause:'<InstanceID>0</InstanceID>',Stop:'<InstanceID>0</InstanceID>',Previous:'<InstanceID>0</InstanceID>'}; await dlna('AVTransport',a,map[a]||'<InstanceID>0</InstanceID>'); if(a==='Play')state.playing=true; if(a==='Pause'||a==='Stop')state.playing=false; paintPlay(); await refreshState(); }catch(e){toast('Erreur '+a);} }
function paintPlay(){ $('#bPlay').style.opacity = state.playing?'.55':'1'; }

async function refreshState(){
  if(!state.sel) return;
  try{
    const t=await dlna('AVTransport','GetTransportInfo','<InstanceID>0</InstanceID>');
    state.playing = t.transportState==='PLAYING'; paintPlay();
    const m=await dlna('AVTransport','GetMediaInfo','<InstanceID>0</InstanceID>');
    let title=null, uri=null;
    if(m.raw){
      const mt=/<CurrentURIMetaData>([\s\S]*?)<\/CurrentURIMetaData>/.exec(m.raw);
      const mu=/<CurrentURI>([\s\S]*?)<\/CurrentURI>/.exec(m.raw);
      const xml=(mt?mt[1]:'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"');
      const dt=/<dc:title>([\s\S]*?)<\/dc:title>/i.exec(xml); if(dt) title=dt[1];
      if(mu && mu[1] && !/^<\/?CurrentURI/.test(mu[1])) uri=mu[1];
    }
    paintNP(title || (uri? decodeURIComponent(uri.split('/').pop()) : null), t.transportState);
    connected(true);
  }catch(e){ connected(false); }
}
function paintNP(title, st){
  const el=$('#np');
  if(!title){ el.innerHTML = `<div class="s">${st?('État : '+st):'En attente'}</div>`; return; }
  el.innerHTML = `<div class="t">${I.music}<span>${esc(title)}</span></div><div class="s">${st||''}</div>
    <div class="eqbar"><i style="animation-delay:0s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.45s"></i><i style="animation-delay:.6s"></i></div>`;
}
function startPolling(){ if(state.polling) clearInterval(state.polling); state.polling=setInterval(refreshState, 4000); }

async function cast(){
  const url=$('#castUrl').value.trim(); if(!url) return toast('Entre une URL');
  const x=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const meta=`<DIDL-Lite xmlns="urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:upnp="urn:schemas-upnp-org:metadata-1-0/upnp/"><item id="0" parentID="-1" restricted="1"><dc:title>Stream</dc:title><upnp:class>object.item.audioItem.musicTrack</upnp:class><res>${x(url)}</res></item></DIDL-Lite>`;
  try{ await dlna('AVTransport','SetAVTransportURI',`<InstanceID>0</InstanceID><CurrentURI>${x(url)}</CurrentURI><CurrentURIMetaData>${x(meta)}</CurrentURIMetaData>`);
       await dlna('AVTransport','Play','<InstanceID>0</InstanceID><Speed>1</Speed>'); toast('Cast lancé'); setTimeout(refreshState,1200); }
  catch(e){ toast('Erreur cast : '+e.message); }
}

// ---------- knob drag ----------
(function(){
  const k=$('#knob'); let dragging=false, lastY=0;
  const down=e=>{ dragging=true; lastY=(e.touches?e.touches[0].clientY:e.clientY); e.preventDefault(); };
  const move=e=>{ if(!dragging)return; const y=(e.touches?e.touches[0].clientY:e.clientY); const dy=lastY-y; lastY=y;
    setVol(Math.max(0,Math.min(100,state.vol+dy*0.55))); e.preventDefault(); };
  const up=()=>{ if(!dragging)return; dragging=false; setVol(Math.round(state.vol)); };
  k.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  k.addEventListener('touchstart',down,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
})();

// ---------- advanced ----------
async function run(path, label){
  const el=$('#diag'); el.style.display='block'; el.textContent=label+'…';
  try{ const r=await fetch(path); el.textContent=(await r.text()).slice(0,20000); }
  catch(e){ el.textContent='Erreur : '+e.message; }
}
function ipOrToast(){ const ip=($('#manualIp').value.trim()|| (state.sel&&state.sel.ip)); if(!ip){toast('Entre une IP');return null;} return ip; }

// ---------- wire ----------
$('#btnScan').onclick=disc;
$('#btnAdd').onclick=addManual;
$('#manualIp').addEventListener('keydown',e=>{if(e.key==='Enter')addManual();});
$('#bMute').onclick=()=>mute(true); $('#bMute').ondblclick=()=>mute(false);
$('#bPlay').onclick=()=>transport('Play');
$('#bPause').onclick=()=>transport('Pause');
$('#bStop').onclick=()=>transport('Stop');
$('#bPrev').onclick=()=>transport('Previous');
$('#bState').onclick=refreshState;
$('#bCast').onclick=cast;
$('#bDiag').onclick=()=>{const ip=ipOrToast();if(ip)run('/api/diagnose?ip='+encodeURIComponent(ip),'Diagnostic');};
$('#bUnicast').onclick=()=>{const ip=ipOrToast();if(ip)run('/api/probe?ip='+encodeURIComponent(ip),'Probe');};
$('#bDescribe').onclick=()=>{const ip=ipOrToast();if(ip)run('/api/describe?ip='+encodeURIComponent(ip)+'&port='+($('#fetchPort').value||2870),'Describe');};
$('#bAllplay').onclick=()=>{const ip=ipOrToast();if(ip)run('/api/allplay?ip='+encodeURIComponent(ip),'Chasse AllPlay');};

// ---------- boot ----------
(function boot(){
  setRing(0); paintPlay();
  if(location.hash.includes('demo')){
    state.devices=[{ip:'192.168.1.22',name:'Soundstage de Samy et Salomé',services:[1,2,3]}];
    state.sel=state.devices[0]; render(); connected(true); setStatus(state.sel.name);
    state.vol=34; setRing(34); state.playing=true; paintPlay(); paintNP('Daft Punk — Get Lucky','PLAYING');
    return;
  }
  const saved=localStorage.getItem('ss_ip');
  if(saved){ merge([{ip:saved,name:'Enceinte enregistrée'}]); render(); select(saved); }
  disc();
})();
</script>
